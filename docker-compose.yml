# ReelForge — AI YouTube Short Video Generator
# Local development stack: the Next.js 15 app + the Inngest dev server.
#
# Everything else is a managed cloud service and is NOT containerised here:
#   - Neon PostgreSQL  -> DATABASE_URL
#   - Groq / Gemini / Cloudflare / Deepgram -> API keys
#   - Firebase Auth    -> NEXT_PUBLIC_FIREBASE_API_KEY
#   - AWS S3 + Remotion Lambda -> REMOTION_AWS_* keys
#
# Put those credentials in .env / .env.local (see SETUP.md).

services:
  app:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0 -p 3000"
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      # Keep host node_modules / build cache out of the container.
      - /app/node_modules
      - /app/.next
    env_file:
      - .env
      - .env.local
    environment:
      - NODE_ENV=development
      # Point the Inngest SDK at the dev server container instead of localhost.
      - INNGEST_DEV=1
      - INNGEST_BASE_URL=http://inngest:8288
      # More reliable file watching across bind mounts.
      - WATCHPACK_POLLING=true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  inngest:
    image: inngest/inngest
    command: "inngest dev -u http://app:3000/api/inngest"
    ports:
      - "${INNGEST_PORT:-8288}:8288"
      - "${INNGEST_CONNECT_PORT:-8289}:8289" # used for connect()
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
