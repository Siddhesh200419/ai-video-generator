name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    env:
      # `next build` imports API routes and prerenders pages, so these must be
      # non-empty or the build fails (Groq throws on a missing key, Firebase on
      # an empty one). No network calls are made at build time, so placeholders
      # are enough — real repo secrets are used automatically when configured.
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'ci-build-placeholder' }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'ci-build-placeholder' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
